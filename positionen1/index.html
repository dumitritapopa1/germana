<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hängen, stehen oder liegen?</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2430;--muted:#5d6472;--line:#e3e6eb;--accent:#3b5bdb;--accent-soft:#e8edff;--ok:#1f8a5b;--ok-soft:#e6f5ee;--bad:#c92a2a;--bad-soft:#fdecec}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;display:flex;flex-direction:column}
header{padding:10px 24px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
.tabs{display:flex;gap:6px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 16px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .dn{display:none;margin-left:4px}.tab.done .dn{display:inline}
.total{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted)}
section.ex{display:none;flex:1;min-height:0;flex-direction:column}
section.ex.on{display:flex}
.wrap{flex:1;padding:16px 24px;min-height:0;display:flex;gap:16px;justify-content:center}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-y:auto;min-height:0}
.wrap.split .pane{flex:1}
.wrap.one .pane{width:100%;max-width:780px}
.pi{padding:20px 26px}
.instr{margin:0 0 14px;padding:12px 16px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:6px;font-weight:600}
.instr small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
.txt h2{margin:0 0 12px;font-size:20px}
.txt p{margin:0 0 14px;font-size:17px;line-height:1.7}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none}
.q h3{margin:0 0 10px;font-size:17px}
.opt{display:flex;align-items:center;gap:12px;padding:9px 13px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;font-size:16px}
.opt:hover{border-color:#aeb6c8}
.opt input{position:absolute;opacity:0;pointer-events:none}
.dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #b7bfce;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 12px var(--accent)}
.opt.locked{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .dot{border-color:var(--ok);background:var(--ok);box-shadow:none}.opt.right .dot::after{content:"✓"}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .dot{border-color:var(--bad);background:var(--bad);box-shadow:none}.opt.wrong .dot::after{content:"✕"}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.right .tag,.opt.missed .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
.gaps p{font-size:18px;line-height:2.3;margin:0 0 14px}
.g{display:inline-flex;align-items:baseline;white-space:nowrap}
.g .pre{font-weight:600}
.g input{font:inherit;font-size:17px;border:none;border-bottom:2px solid #9aa3b5;background:var(--accent-soft);padding:0 3px;margin:0 1px;border-radius:3px 3px 0 0;color:var(--ink);text-align:left}
.g input:focus{outline:none;border-bottom-color:var(--accent);background:#dbe3ff}
.g sup{font-size:11px;color:var(--muted);margin-left:1px}
.g.ok input{background:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok);font-weight:600}
.g.no input{background:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fix{color:var(--ok);font-weight:700;font-size:15px;margin-left:4px}
audio{width:100%;height:40px}
.audio{position:sticky;top:0;background:var(--card);padding-bottom:10px;z-index:2}
.s{padding:14px 0;border-top:1px solid var(--line)}
.s:first-of-type{border-top:none}
.s .st{font-size:17px;margin-bottom:8px}
.rf{display:flex;gap:8px}
.rf button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 20px;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.rf button.on{border-color:var(--accent);background:var(--accent-soft)}
.rf button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.rf button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.rf button.missed{border-color:var(--ok);border-style:dashed;color:var(--ok)}
.fb{font-size:14px;font-weight:700;margin-top:6px}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-top:1px solid var(--line)}
.btn{border:none;border-radius:8px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.msg{font-size:15px;color:var(--muted)}
.score{font-size:16px;font-weight:700}.score.good{color:var(--ok)}.score.mid{color:#b06a00}.score.low{color:var(--bad)}
.hidden{display:none!important}
@media (max-width:820px){
 body{height:auto;min-height:100%}
 header{padding:10px 14px}
 .wrap{padding:10px;flex-direction:column}
 .pane{overflow:visible}
 .pi{padding:16px}
 .total{margin-left:0;width:100%}
 .bar{position:sticky;bottom:0;padding:10px 14px;z-index:5}
 .audio{top:0}
}
</style>
</head>
<body>
<header><h1>Positionsverben</h1><span class="total" id="total"></span></header>
<div class="wrap one" style="overflow-y:auto"><div class="pane" style="height:fit-content"><div class="pi">
 <p class="instr"><i>hängen, stehen</i> oder <i>liegen</i>? Nu uita să conjugi verbele.<small>Tastează forma corectă a verbului.</small></p>
 <div class="gaps" id="gaps"></div>
</div></div></div>
<div class="bar">
 <button class="btn btn-primary" id="chk" disabled>Verifică răspunsurile</button>
 <button class="btn btn-ghost hidden" id="rty">Încearcă din nou</button>
 <span class="msg" id="msg"></span><span class="score hidden" id="score"></span>
</div>
<script>
var ITEMS=[
"Wo ist meine Tasse? Die war immer im Regal. - Jetzt [|stehen] alle Tassen im Schrank.",
"Wo ist die Schokolade? - Die [|liegt] im Kühlschrank.",
"Die Uhr ist nicht mehr im Flur. - Ja genau, die [|hängt] jetzt in der Küche über der Tür.",
"Wo ist die Kaffeemaschine? - Die [|steht] neben dem Regal.",
"Und wo ist der Kaffee? - Der [|steht] im Schrank.",
"Und wo ist der Teppich? - Der [|liegt] jetzt im Flur.",
"Wo ist der Kalender? - Der [|hängt] über dem Tisch."
];
var PASS_PERCENT=50;
var scorm=(function(){var api=null,active=false;
 function find(w){var n=0;while(w&&n<10){try{if(w.API)return w.API;}catch(e){}if(w.parent&&w.parent!==w){w=w.parent;n++;}else break;}return null;}
 function init(){api=find(window);if(!api){try{if(window.opener)api=find(window.opener);}catch(e){}}
  if(api){try{active=String(api.LMSInitialize(""))==="true";if(active){var st=api.LMSGetValue("cmi.core.lesson_status");if(st==="not attempted"||st==="")api.LMSSetValue("cmi.core.lesson_status","incomplete");api.LMSCommit("");}}catch(e){active=false;}}}
 function report(c,t){if(!active)return;var p=Math.round(c/t*100);try{api.LMSSetValue("cmi.core.score.min","0");api.LMSSetValue("cmi.core.score.max","100");api.LMSSetValue("cmi.core.score.raw",String(p));api.LMSSetValue("cmi.core.lesson_status",p>=PASS_PERCENT?"passed":"failed");api.LMSCommit("");}catch(e){}}
 function finish(){if(!active)return;try{api.LMSFinish("");}catch(e){}active=false;}
 return{init:init,report:report,finish:finish};})();


function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function norm(s){return String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");}
var G=[],h="",done=false;
ITEMS.forEach(function(t,n){h+='<p><b>'+(n+1)+'.</b> '+t.split(/(\[[^\]]+\])/).map(function(x){
 var m=x.match(/^\[([^|]*)\|([^\]]+)\]$/);if(!m)return esc(x);
 var i=G.length;G.push({p:m[1],r:m[2]});
 return '<span class="g" data-g="'+i+'"><span class="pre">'+esc(m[1])+'</span><input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:'+(Math.max(m[2].length,3)+1.5)+'ch"></span>';
}).join("")+'</p>';});
$("gaps").innerHTML=h;
function filled(){var n=0;document.querySelectorAll("#gaps input").forEach(function(x){if(x.value.trim())n++;});return n;}
function upd(){var n=filled();$("chk").disabled=n<G.length;$("msg").textContent=n<G.length?"Ai completat "+n+" din "+G.length+".":"Gata! Apasă „Verifică răspunsurile”.";}
$("gaps").addEventListener("input",upd);
$("chk").addEventListener("click",function(){var c=0;
 document.querySelectorAll("#gaps .g").forEach(function(sp){var g=G[+sp.dataset.g],inp=sp.querySelector("input"),full=norm(g.p+g.r),v=inp.value;
  var ok=norm(g.p+v)===full||norm(v)===full;inp.readOnly=true;sp.classList.add(ok?"ok":"no");
  if(ok)c++;else{var f=document.createElement("span");f.className="fix";f.textContent="→ "+g.p+g.r;sp.appendChild(f);}});
 var p=Math.round(c/G.length*100);$("score").textContent="Rezultat: "+c+" / "+G.length+" ("+p+"%)";
 $("score").className="score "+(p>=80?"good":p>=PASS_PERCENT?"mid":"low");$("total").textContent="Gesamt: "+c+" / "+G.length;
 $("msg").classList.add("hidden");$("chk").classList.add("hidden");$("rty").classList.remove("hidden");scorm.report(c,G.length);});
$("rty").addEventListener("click",function(){document.querySelectorAll("#gaps .g").forEach(function(sp){sp.className="g";var i=sp.querySelector("input");i.value="";i.readOnly=false;var f=sp.querySelector(".fix");if(f)f.remove();});
 $("score").className="score hidden";$("total").textContent="";$("msg").classList.remove("hidden");$("chk").classList.remove("hidden");$("rty").classList.add("hidden");upd();});
upd();scorm.init();window.addEventListener("pagehide",scorm.finish);
</script>
</body>
</html>
